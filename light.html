<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cardinal</title>
<meta name="description" content="Cardinal — Technology &amp; Capital" />
<meta property="og:title" content="Cardinal" />
<meta property="og:description" content="Technology &amp; Capital" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://cardinalcapital.xyz" />
<meta name="theme-color" content="#F4EFE6" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 0 L37.5 30.5 L32 36 L26.5 30.5 Z' fill='%23A4243B'/%3E%3Cpath d='M56 36 L37.5 41.5 L32 36 L37.5 30.5 Z' fill='%230E2A47'/%3E%3Cpath d='M32 62 L26.5 41.5 L32 36 L37.5 41.5 Z' fill='%230E2A47'/%3E%3Cpath d='M8 36 L26.5 30.5 L32 36 L26.5 41.5 Z' fill='%230E2A47'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream:    #F4EFE6;
    --navy:     #0E2A47;
    --cardinal: #A4243B;
    --brass:    #B08544;
    --slate:    #6B7480;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--cream);
    color: var(--navy);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  /* soft vignette — light falls toward the center */
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 120% 90% at 50% 44%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(ellipse 140% 120% at 50% 50%, transparent 55%, rgba(14,42,71,0.055));
    z-index: 1;
  }

  /* paper grain */
  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(14,42,71,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    z-index: 1;
  }

  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transform: translateY(-3vh);
  }

  .wordmark {
    font-family: 'Fraunces', 'Cambria', 'Georgia', serif;
    font-weight: 300;
    font-variation-settings: 'opsz' 144;
    font-size: clamp(3.4rem, 10vw, 6.4rem);
    letter-spacing: 0.015em;
    line-height: 1.05;
    color: var(--navy);
    user-select: none;
    animation: rise 1s ease-out both;
  }

  /* brass rule with the compass rose at center — north in cardinal */
  .rule {
    margin-top: 2rem;
    display: flex;
    align-items: center;
    gap: 1.1rem;
    animation: rise 1s ease-out 0.15s both;
  }

  .rule .line {
    width: clamp(64px, 11vw, 108px);
    height: 1px;
    background: linear-gradient(to right, transparent, var(--brass));
    opacity: 0.65;
  }

  .rule .line:last-child {
    background: linear-gradient(to left, transparent, var(--brass));
  }

  .mark {
    width: clamp(30px, 4.6vw, 38px);
    height: clamp(30px, 4.6vw, 38px);
    flex: none;
  }

  .mark .n-lit  { fill: var(--cardinal); }
  .mark .n-dim  { fill: var(--cardinal); opacity: 0.55; }
  .mark .p-lit  { fill: var(--navy); }
  .mark .p-dim  { fill: var(--navy); opacity: 0.45; }

  /* contact — reads "contact", reveals the address on hover/focus */
  .contact {
    margin-top: 2.4rem;
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: lowercase;
    color: var(--slate);
    animation: rise 1s ease-out 0.35s both;
  }

  .contact a {
    position: relative;
    display: inline-block;
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(176,133,68,0.35);
    padding-bottom: 2px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  .contact .label {
    display: inline-block;
    transition: opacity 0.25s ease;
  }

  .contact .email {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    padding-bottom: 2px;
    border-bottom: 1px solid currentColor;
    transition: opacity 0.25s ease 0.05s;
  }

  .contact a:hover,
  .contact a:focus {
    color: var(--cardinal);
    border-bottom-color: transparent;
  }

  .contact a:hover .label,
  .contact a:focus .label { opacity: 0; }

  .contact a:hover .email,
  .contact a:focus .email { opacity: 1; }

  .foot {
    position: fixed;
    bottom: 2rem;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.66rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--slate);
    opacity: 0.55;
    z-index: 2;
    animation: rise 1s ease-out 0.6s both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .wordmark, .rule, .contact, .foot { animation: none; }
  }

  ::selection { background: var(--cardinal); color: var(--cream); }
</style>
</head>
<body>
  <main class="stage">
    <h1 class="wordmark">Cardinal</h1>

    <div class="rule">
      <span class="line" aria-hidden="true"></span>
      <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Cardinal compass mark">
        <!-- north point — elongated, the cardinal direction -->
        <path class="n-lit" d="M32 0 L32 36 L26.5 30.5 Z" />
        <path class="n-dim" d="M32 0 L37.5 30.5 L32 36 Z" />
        <!-- east -->
        <path class="p-lit" d="M56 36 L32 36 L37.5 30.5 Z" />
        <path class="p-dim" d="M56 36 L37.5 41.5 L32 36 Z" />
        <!-- south -->
        <path class="p-lit" d="M32 62 L32 36 L37.5 41.5 Z" />
        <path class="p-dim" d="M32 62 L26.5 41.5 L32 36 Z" />
        <!-- west -->
        <path class="p-lit" d="M8 36 L32 36 L26.5 41.5 Z" />
        <path class="p-dim" d="M8 36 L26.5 30.5 L32 36 Z" />
      </svg>
      <span class="line" aria-hidden="true"></span>
    </div>

    <p class="contact">
      <a href="mailto:alex@cardinalcapital.xyz">
        <span class="label">contact</span>
        <span class="email" aria-hidden="true">alex@cardinalcapital.xyz</span>
      </a>
    </p>
  </main>

  <footer class="foot">© MMXXVI · Cardinal · Cardinal Capital · Cardinal Technologies</footer>
</body>
</html>
