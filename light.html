<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cardinal</title>
<meta name="description" content="Cardinal — Technology &amp; Capital" />
<meta property="og:title" content="Cardinal" />
<meta property="og:description" content="Technology &amp; Capital" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://cardinalcapital.xyz" />
<meta name="theme-color" content="#F4EFE6" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 0 L37.5 30.5 L32 36 L26.5 30.5 Z' fill='%23A4243B'/%3E%3Cpath d='M56 36 L37.5 41.5 L32 36 L37.5 30.5 Z' fill='%230E2A47'/%3E%3Cpath d='M32 62 L26.5 41.5 L32 36 L37.5 41.5 Z' fill='%230E2A47'/%3E%3Cpath d='M8 36 L26.5 30.5 L32 36 L26.5 41.5 Z' fill='%230E2A47'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream:    #F4EFE6;
    --navy:     #0E2A47;
    --cardinal: #A4243B;
    --brass:    #B08544;
    --slate:    #6B7480;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--cream);
    color: var(--navy);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  /* soft vignette — light falls toward the center */
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 120% 90% at 50% 44%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(ellipse 140% 120% at 50% 50%, transparent 55%, rgba(14,42,71,0.055));
    z-index: 1;
  }

  /* paper grain */
  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(14,42,71,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    z-index: 1;
  }

  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transform: translateY(-3vh);
  }

  .wordmark {
    font-family: 'Fraunces', 'Cambria', 'Georgia', serif;
    font-weight: 300;
    font-variation-settings: 'opsz' 144;
    font-size: clamp(3.4rem, 10vw, 6.4rem);
    letter-spacing: 0.015em;
    line-height: 1.05;
    color: var(--navy);
    user-select: none;
    animation: rise 1s ease-out both;
  }

  /* brass rule with the compass rose at center — north in cardinal */
  .rule {
    margin-top: 2rem;
    display: flex;
    align-items: center;
    gap: 1.1rem;
    animation: rise 1s ease-out 0.15s both;
  }

  .rule .line {
    width: clamp(64px, 11vw, 108px);
    height: 1px;
    background: linear-gradient(to right, transparent, var(--brass));
    opacity: 0.65;
  }

  .rule .line:last-child {
    background: linear-gradient(to left, transparent, var(--brass));
  }

  .mark {
    width: clamp(38px, 5.8vw, 48px);
    height: clamp(38px, 5.8vw, 48px);
    flex: none;
    overflow: visible;
  }

  .mark .ring   { fill: none; stroke: var(--brass); stroke-width: 1.25; opacity: 0.55; }
  .mark .tick   { stroke: var(--brass); stroke-width: 1.5; opacity: 0.75; }
  .mark .n-lit  { fill: var(--cardinal); }
  .mark .n-dim  { fill: var(--cardinal); opacity: 0.55; }
  .mark .t-lit  { fill: var(--navy); opacity: 0.9; }
  .mark .t-dim  { fill: var(--navy); opacity: 0.45; }
  .mark .pivot  { fill: var(--cream); stroke: var(--brass); stroke-width: 1.25; }

  /* the cardinal — takes flight when you find "contact" */
  #bird {
    position: fixed;
    left: 0; top: 0;
    width: 34px;
    height: auto;
    z-index: 3;
    opacity: 0;
    pointer-events: none;
    will-change: transform, opacity;
  }

  #bird .body { fill: var(--cardinal); }
  #bird .wing {
    fill: #7E1B2E;
    transform-origin: 14px 12px;
    animation: flap 0.24s ease-in-out infinite alternate;
  }

  @keyframes flap {
    from { transform: rotate(-14deg); }
    to   { transform: rotate(24deg); }
  }

  /* contact — reads "contact", reveals the address on hover/focus */
  .contact {
    margin-top: 2.4rem;
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: lowercase;
    color: var(--slate);
    animation: rise 1s ease-out 0.35s both;
  }

  .contact a {
    position: relative;
    display: inline-block;
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(176,133,68,0.35);
    padding-bottom: 2px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  .contact .label {
    display: inline-block;
    transition: opacity 0.25s ease;
  }

  .contact .email {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    padding-bottom: 2px;
    border-bottom: 1px solid currentColor;
    transition: opacity 0.25s ease 0.05s;
  }

  .contact a:hover,
  .contact a:focus {
    color: var(--cardinal);
    border-bottom-color: transparent;
  }

  .contact a:hover .label,
  .contact a:focus .label { opacity: 0; }

  .contact a:hover .email,
  .contact a:focus .email { opacity: 1; }

  .foot {
    position: fixed;
    bottom: 2rem;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.66rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--slate);
    opacity: 0.55;
    z-index: 2;
    animation: rise 1s ease-out 0.6s both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .wordmark, .rule, .contact, .foot { animation: none; }
  }

  ::selection { background: var(--cardinal); color: var(--cream); }
</style>
</head>
<body>
  <main class="stage">
    <h1 class="wordmark">Cardinal</h1>

    <div class="rule">
      <span class="line" aria-hidden="true"></span>
      <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Cardinal compass mark">
        <!-- fixed dial: brass ring + cardinal ticks -->
        <circle class="ring" cx="32" cy="32" r="26" />
        <line class="tick" x1="32" y1="1"  x2="32" y2="7" />
        <line class="tick" x1="63" y1="32" x2="57" y2="32" />
        <line class="tick" x1="32" y1="63" x2="32" y2="57" />
        <line class="tick" x1="1"  y1="32" x2="7"  y2="32" />
        <!-- needle: cardinal-red north tip, navy tail; rotates to your cursor -->
        <g id="needle">
          <path class="n-lit" d="M32 8 L32 34 L27.8 29.8 Z" />
          <path class="n-dim" d="M32 8 L36.2 29.8 L32 34 Z" />
          <path class="t-lit" d="M32 56 L32 32 L36 36 Z" />
          <path class="t-dim" d="M32 56 L28 36 L32 32 Z" />
          <circle class="pivot" cx="32" cy="32" r="3.2" />
        </g>
      </svg>
      <span class="line" aria-hidden="true"></span>
    </div>

    <p class="contact">
      <a href="mailto:contact@cardinalcapital.xyz">
        <span class="label">contact</span>
        <span class="email" aria-hidden="true">contact@cardinalcapital.xyz</span>
      </a>
    </p>
  </main>

  <footer class="foot">© MMXXVI · Cardinal · Cardinal Capital · Cardinal Technologies</footer>

  <!-- the cardinal -->
  <svg id="bird" viewBox="0 0 36 28" aria-hidden="true">
    <path class="body" d="M2 10 L12 12.2 C13 9.4 15.4 7.6 18.4 7.2 L19.2 6.8 L21.2 1.6 L23.2 6.6 C25.8 7 28 8.6 29 11 L35 12.6 L29.2 14 C28.4 17.8 25 20.2 20.6 20.4 C16.8 20.6 13.4 19.4 11.6 17 L2 16 L5.4 13 Z" />
    <path class="wing" d="M14.5 13 C18.5 10 23 10.2 25.6 12.6 C23.4 16.2 18 17.2 13.2 15.2 Z" />
  </svg>

  <script>
    (() => {
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* ---- compass needle follows the cursor, springs back to north ---- */
      const needle = document.getElementById('needle');
      const mark = document.querySelector('.mark');
      if (!reduced && matchMedia('(pointer: fine)').matches) {
        let target = 0, angle = 0, vel = 0, lastMove = -1e9;

        addEventListener('pointermove', (e) => {
          const r = mark.getBoundingClientRect();
          const dx = e.clientX - (r.left + r.width / 2);
          const dy = e.clientY - (r.top + r.height / 2);
          if (Math.hypot(dx, dy) < 12) return; // dead zone over the pivot
          target = Math.atan2(dx, -dy) * 180 / Math.PI;
          lastMove = performance.now();
        });

        document.documentElement.addEventListener('mouseleave', () => { lastMove = -1e9; });

        (function tick(now) {
          if (now - lastMove > 2500) target = 0; // drawn back to true north
          let diff = ((target - angle + 540) % 360) - 180;
          vel = vel * 0.95 + diff * 0.002; // gentle magnetic spring, heavy damping
          angle += vel;
          needle.setAttribute('transform', `rotate(${angle.toFixed(2)} 32 32)`);
          requestAnimationFrame(tick);
        })(0);
      }

      /* ---- the cardinal takes a random flight on hovering "contact" ---- */
      const bird = document.getElementById('bird');
      const contact = document.querySelector('.contact a');
      let flying = false;

      function bez(pts, t) {
        const a = pts.map(p => [p[0], p[1]]);
        for (let k = a.length - 1; k > 0; k--)
          for (let i = 0; i < k; i++) {
            a[i][0] += (a[i + 1][0] - a[i][0]) * t;
            a[i][1] += (a[i + 1][1] - a[i][1]) * t;
          }
        return a[0];
      }

      function fly() {
        if (flying || reduced) return;
        flying = true;

        const W = innerWidth, H = innerHeight;
        const r = contact.getBoundingClientRect();
        // random swoop: launch from "contact", wander, exit a random side
        const pts = [[r.left + r.width / 2, r.top - 6]];
        const n = 3 + Math.floor(Math.random() * 3);
        for (let i = 0; i < n; i++)
          pts.push([W * (0.12 + 0.76 * Math.random()), H * (0.12 + 0.6 * Math.random())]);
        pts.push([Math.random() < 0.5 ? -60 : W + 60, H * (0.08 + 0.45 * Math.random())]);

        const dur = 5200 + Math.random() * 2400;
        const t0 = performance.now();

        (function step(now) {
          const t = Math.min((now - t0) / dur, 1);
          const [x, y] = bez(pts, t);
          const [x2, y2] = bez(pts, Math.min(t + 0.012, 1));
          const dx = x2 - x, dy = y2 - y;
          const flip = dx < 0 ? -1 : 1;
          const tilt = Math.max(-28, Math.min(28, Math.atan2(dy, Math.abs(dx)) * 57.3 * flip));
          bird.style.opacity = t < 0.06 ? t / 0.06 : t > 0.92 ? (1 - t) / 0.08 : 1;
          bird.style.transform =
            `translate(${x - 17}px, ${y - 14}px) scaleX(${flip}) rotate(${tilt}deg)`;
          if (t < 1) requestAnimationFrame(step);
          else { bird.style.opacity = 0; flying = false; }
        })(t0);
      }

      contact.addEventListener('mouseenter', fly);
      contact.addEventListener('focus', fly);
    })();
  </script>
</body>
</html>
